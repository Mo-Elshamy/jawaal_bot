amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2                  # Expected noise in odometry's rotation from rotation
    alpha2: 0.2                  # Expected noise in odometry's rotation from translation
    alpha3: 0.2                  # Expected noise in odometry's translation from translation
    alpha4: 0.2                  # Expected noise in odometry's translation from rotation
    alpha5: 0.1                  # Noise for omnidirectional translation (unused for diff-drive)
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    odom_frame_id: "odom"
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    max_beams: 60                # Number of evenly spaced lidar beams used in particle scoring
    max_particles: 2000          # Maximum particle filter count
    min_particles: 500           # Minimum particle filter count
    odom_model_type: "diff-corrected"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true           # Broadcast dynamic map -> odom transform
    transform_tolerance: 0.5
    update_min_a: 0.1            # Rotational movement required to trigger filter update (~6 deg)
    update_min_d: 0.1            # Linear distance required to trigger filter update (10 cm)
    z_hit: 0.8                   # Laser scan match probability weights
    z_rand: 0.05
    z_max: 0.05
    z_short: 0.1
    scan_topic: /scan
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""            # Provided dynamically via launch file