ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true              # Forces Roll, Pitch, Z to 0 for a flat floor robot
    publish_tf: true              # Publishes the odom -> base_link transform

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # --- Sensor 1: Wheel Odometry ---
    odom0: /wheel_odom
    odom0_config: [false, false, false,   # Position x, y, z
                   false, false, false,   # Orientation roll, pitch, yaw
                   true,  false, false,   # Linear velocity vx, vy, vz
                   false, false, true,    # Angular velocity vroll, vpitch, vyaw
                   false, false, false]   # Acceleration ax, ay, az
    odom0_differential: false

    # --- Sensor 2: Raw GY-87 IMU ---
    imu0: /imu/data_raw
    imu0_config: [false, false, false,   # Position x, y, z
                  false, false, true,    # Orientation roll, pitch, yaw
                  false, false, false,   # Linear velocity vx, vy, vz
                  false, false, true,    # Angular velocity vroll, vpitch, vyaw
                  true,  false, false]   # Acceleration ax, ay, az
    imu0_differential: false
