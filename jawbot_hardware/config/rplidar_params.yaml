rplidar_node:
  ros__parameters:
    channel_type: "serial"
    serial_port: "/dev/ttyUSB0"      # Update to /dev/rplidar if using udev rules
    serial_baudrate: 115200          # 115200 for RPLiDAR A1/A2, 256000 for A3/S1/S2
    frame_id: "lidar_link"           # Must match the frame name in jawbot_description
    inverted: false
    angle_compensate: true
    scan_mode: "Standard"